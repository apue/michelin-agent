[project]
name = "michelin-maps-agent"
version = "0.2.0"
description = "Agent-operated Michelin Guide to Google Maps Saved pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40.0",
  "requests>=2.31.0",
]

[project.scripts]
michelin-maps = "michelin_maps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["michelin_maps*"]

[tool.setuptools.package-data]
michelin_maps = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
